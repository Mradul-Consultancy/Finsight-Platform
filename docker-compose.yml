version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finsight-postgres
    restart: always
    environment:
      POSTGRES_DB: finsight
      POSTGRES_USER: finsight_user
      POSTGRES_PASSWORD: finsight_password
    ports:
      - "5432:5432"
    volumes:
      - finsight_pgdata:/var/lib/postgresql/data
      - ./database/01_schemas.sql:/docker-entrypoint-initdb.d/01_schemas.sql
      - ./database/02_tables.sql:/docker-entrypoint-initdb.d/02_tables.sql
      - ./database/03_indexes.sql:/docker-entrypoint-initdb.d/03_indexes.sql
      - ./database/04_views.sql:/docker-entrypoint-initdb.d/04_views.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight_user -d finsight"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  finsight_pgdata:
    driver: local
